<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 130" width="1200" height="130" role="img" aria-labelledby="ash-ft-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ash-ft-title">Data informs decisions. Products evolve through insights.</title>
  <defs>
    <style>
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) { .motion { display: none; } .still { display: inline; } }
      .quote { font-family: Georgia, 'Times New Roman', 'Noto Serif', serif; font-style: italic; }
      .sig { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; }
    </style>
    <linearGradient id="ash-ft-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="1" stop-color="#190B12"/>
    </linearGradient>
    <linearGradient id="ash-ft-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>
    <filter id="ash-ft-glow" x="-50%" y="-300%" width="200%" height="700%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1200" height="130" rx="20" fill="url(#ash-ft-bg)"/>
  <rect x="100" y="24" width="1000" height="2" fill="url(#ash-ft-line)" filter="url(#ash-ft-glow)"/>
  <rect x="100" y="24" width="1000" height="1" fill="url(#ash-ft-line)"/>
  <g class="motion">
    <rect x="100" y="23" width="90" height="3" rx="1.5" fill="#F8F0F3" opacity="0.8" filter="url(#ash-ft-glow)">
      <animate attributeName="x" values="100;1010;100" dur="10s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
    </rect>
  </g>
  <text class="quote" x="600" y="72" font-size="22" text-anchor="middle" fill="#E5B5C7">Data informs decisions. Products evolve through insights.</text>
  <text class="sig" x="600" y="102" font-size="13" text-anchor="middle" fill="#C77B9B">Aditya Srivastav</text>
</svg>
