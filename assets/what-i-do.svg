<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-labelledby="aw-t aw-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="aw-t">What I do</title><desc id="aw-d">Three focus areas: enterprise data management, analytics and BI, applied AI.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="aw-clip"><rect width="1200" height="230" rx="20"/></clipPath>
<filter id="aw-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="aw-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="aw-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="1" stop-color="#190B12"/></linearGradient>
<linearGradient id="aw-bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#701A3D"/><stop offset="1" stop-color="#C77B9B"/></linearGradient></defs>
<g clip-path="url(#aw-clip)"><rect width="1200" height="230" fill="url(#aw-bg)"/><rect x="2" y="8" width="376" height="214" rx="18" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".35"/><rect class="motion" x="2" y="8" width="376" height="214" rx="18" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.12 0.88" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="6s" begin="-0s" repeatCount="indefinite"/></rect><text class="serif" x="120" y="58" font-size="21" font-weight="700" fill="#F8F0F3">Enterprise data</text><text class="sans" x="28" y="128" font-size="14" fill="#E5B5C7">SAP master data, migration and</text><text class="sans" x="28" y="150" font-size="14" fill="#E5B5C7">requirements analysis, so the business</text><text class="sans" x="28" y="172" font-size="14" fill="#E5B5C7">can trust the data it runs on.</text><rect x="412" y="8" width="376" height="214" rx="18" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".35"/><rect class="motion" x="412" y="8" width="376" height="214" rx="18" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.12 0.88" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="7s" begin="-2s" repeatCount="indefinite"/></rect><text class="serif" x="530" y="58" font-size="21" font-weight="700" fill="#F8F0F3">Analytics and BI</text><text class="sans" x="438" y="128" font-size="14" fill="#E5B5C7">KPI design and Power BI dashboards</text><text class="sans" x="438" y="150" font-size="14" fill="#E5B5C7">that tie data to a decision</text><text class="sans" x="438" y="172" font-size="14" fill="#E5B5C7">someone actually has to make.</text><rect x="822" y="8" width="376" height="214" rx="18" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".35"/><rect class="motion" x="822" y="8" width="376" height="214" rx="18" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.12 0.88" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="8s" begin="-4s" repeatCount="indefinite"/></rect><text class="serif" x="940" y="58" font-size="21" font-weight="700" fill="#F8F0F3">Applied AI</text><text class="sans" x="848" y="128" font-size="14" fill="#E5B5C7">Machine learning and computer vision</text><text class="sans" x="848" y="150" font-size="14" fill="#E5B5C7">projects, now exploring LangChain</text><text class="sans" x="848" y="172" font-size="14" fill="#E5B5C7">and Qdrant for LLM work.</text><g transform="translate(28 30)" fill="none" stroke="#E5B5C7" stroke-width="2"><ellipse cx="34" cy="10" rx="30" ry="9"/><path d="M4 10V50C4 55 18 59 34 59S64 55 64 50V10M4 30C4 35 18 39 34 39S64 35 64 30"/></g><circle cx="62" cy="40" r="4" fill="#F8F0F3"><animate attributeName="cy" values="40;80;40" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><path d="M438 30 V92 H508" fill="none" stroke="#E5B5C7" stroke-width="2"/><rect x="448" y="64" width="10" height="26" rx="2" fill="url(#aw-bar)"><animate attributeName="height" values="26;10;26;31;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="y" values="64;80;64;59;64" dur="2.4s" repeatCount="indefinite"/></rect><rect x="463" y="50" width="10" height="40" rx="2" fill="url(#aw-bar)"><animate attributeName="height" values="40;16;40;48;40" dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="50;74;50;42;50" dur="3.1s" repeatCount="indefinite"/></rect><rect x="478" y="72" width="10" height="18" rx="2" fill="url(#aw-bar)"><animate attributeName="height" values="18;7;18;22;18" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="72;83;72;68;72" dur="2.8s" repeatCount="indefinite"/></rect><rect x="493" y="40" width="10" height="50" rx="2" fill="url(#aw-bar)"><animate attributeName="height" values="50;20;50;56;50" dur="3.5s" repeatCount="indefinite"/><animate attributeName="y" values="40;70;40;34;40" dur="3.5s" repeatCount="indefinite"/></rect><line x1="854" y1="42" x2="884" y2="52" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="854" y1="42" x2="884" y2="76" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="854" y1="64" x2="884" y2="52" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="854" y1="64" x2="884" y2="76" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="854" y1="86" x2="884" y2="52" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="854" y1="86" x2="884" y2="76" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="884" y1="52" x2="916" y2="64" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><line x1="884" y1="76" x2="916" y2="64" stroke="#C77B9B" stroke-opacity=".6" stroke-dasharray="3 4"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="1.2s" repeatCount="indefinite"/></line><circle cx="854" cy="42" r="5" fill="#F8F0F3"><animate attributeName="r" values="4;7;4" dur="1.60s" repeatCount="indefinite"/></circle><circle cx="854" cy="64" r="5" fill="#F8F0F3"><animate attributeName="r" values="4;7;4" dur="1.85s" repeatCount="indefinite"/></circle><circle cx="854" cy="86" r="5