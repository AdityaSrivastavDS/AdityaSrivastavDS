<ellipse cx="320" cy="48" rx="150" ry="70" fill="url(#alinstagram-r)"><animate attributeName="rx" values="130;170;130" dur="4s" repeatCount="indefinite"/></ellipse>
<rect x="1" y="1" width="398" height="94" rx="17" fill="none" stroke="#C77B9B" stroke-opacity=".4"/><rect class="motion" x="1" y="1" width="398" height="94" rx="17" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.14 0.86" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="5s" begin="-0s" repeatCount="indefinite"/></rect>
