<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 96" width="400" height="96" role="img" aria-labelledby="alinstagram-t alinstagram-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="alinstagram-t">Instagram</title><desc id="alinstagram-d">Instagram @aditya_srivastav_ds</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
