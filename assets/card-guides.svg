<title id="acg-t">Complete Guides</title><desc id="acg-d">My study notes, kept in public: one guide each for Java, Python and Data Science.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
