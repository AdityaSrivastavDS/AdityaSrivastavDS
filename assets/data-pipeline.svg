<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="ap-t ap-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ap-t">Enterprise data migration flow</title><desc id="ap-d">Animated flow of data packets through five stages: source systems, profile and cleanse, map and transform, migrate and validate, govern and analyse.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="ap-clip"><rect width="1200" height="290" rx="20"/></clipPath>
<filter id="ap-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="ap-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="ap-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="1" stop-color="#190B12"/></linearGradient>
<linearGradient id="ap-ln" x1="0" x2="1"><stop offset="0" stop-color="#701A3D"/><stop offset=".5" stop-color="#C77B9B"/><stop offset="1" stop-color="#E5B5C7"/></linearGradient>
<path id="ap-path" d="M30 150 H1170"/></defs>
<g clip-path="url(#ap-clip)"><rect width="1200" height="290" fill="url(#ap-bg)"/>
<use xlink:href="#ap-path" stroke="url(#ap-ln)" stroke-width="2" stroke-dasharray="3 9" fill="none"/><g><rect x="15" y="112" width="210" height="76" rx="16" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="15" y="112" width="210" height="76" rx="16" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-opacity=".35"><animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35;1;0.35;0.35;1;0.35;0.35" keyTimes="0;0.0389;0.0789;0.1389;0.3723;0.4123;0.4723;0.7056;0.7456;0.8056;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text class="sans" x="30" y="132" font-size="12" fill="#C77B9B">1</text>
<text class="serif" x="120" y="156" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F8F0F3">Source systems</text>
<text class="sans" x="120" y="218" font-size="13.5" text-anchor="middle" fill="#E5B5C7">Legacy and SAP data</text><text class="sans" x="120" y="238" font-size="13.5" text-anchor="middle" fill="#E5B5C7">lands in one place</text></g><g><rect x="255" y="112" width="210" height="76" rx="16" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="255" y="112" width="210" height="76" rx="16" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-opacity=".35"><animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35;1;0.35;0.35;1;0.35;0.35" keyTimes="0;0.2495;0.2895;0.3495;0.5828;0.6228;0.6828;0.89;0.93;0.99;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text class="sans" x="270" y="132" font-size="12" fill="#C77B9B">2</text>
<text class="serif" x="360" y="156" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F8F0F3">Profile and cleanse</text>
<text class="sans" x="360" y="218" font-size="13.5" text-anchor="middle" fill="#E5B5C7">Duplicates, gaps and</text><text class="sans" x="360" y="238" font-size="13.5" text-anchor="middle" fill="#E5B5C7">inconsistencies surface</text></g><g><rect x="495" y="112" width="210" height="76" rx="16" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="495" y="112" width="210" height="76" rx="16" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-opacity=".35"><animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35;1;0.35;0.35;1;0.35;0.35" keyTimes="0;0.1267;0.1667;0.2267;0.46;0.5;0.56;0.7933;0.8333;0.8933;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text class="sans" x="510" y="132" font-size="12" fill="#C77B9B">3</text>
<text class="serif" x="600" y="156" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F8F0F3">Map and transform</text>
<text class="sans" x="600" y="218" font-size="13.5" text-anchor="middle" fill="#E5B5C7">Fields mapped to the</text><text class="sans" x="600" y="238" font-size="13.5" text-anchor="middle" fill="#E5B5C7">target data model</text></g><g><rect x="735" y="112" width="210" height="76" rx="16" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="735" y="112" width="210" height="76" rx="16" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-opacity=".35"><animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35;1;0.35;0.35;1;0.35;0.35" keyTimes="0;0.01;0.05;0.11;0.3372;0.3772;0.4372;0.6705;0.7105;0.7705;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text class="sans" x="750" y="132" font-size="12" fill="#C77B9B">4</text>
<text class="serif" x="840" y="156" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F8F0F3">Migrate and validate</text>
<text class="sans" x="840" y="218" font-size="13.5" text-anchor="middle" fill="#E5B5C7">Load, reconcile and</text><text class="sans" x="840" y="238" font-size="13.5" text-anchor="middle" fill="#E5B5C7">sign off with the business</text></g><g><rect x="975" y="112" width="210" height="76" rx="16" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="975" y="112" width="210" height="76" rx="16" fill="none" stroke="#F8F0F3" stroke-width="2" stroke-opacity=".35"><animate attributeName="stroke-opacity" values="0.35;0.35;1;0.35;0.35;1;0.35;0.35;1;0.35;0.35" keyTimes="0;0.2144;0.2544;0.3144;0.5477;0.5877;0.6477;0.8811;0.9211;0.9811;1" dur="8.0s" repeatCount="indefinite"/></rect>
<text class="sans" x="990" y="132" font-size="12" fill="#C77B9B">5</text>
<text class="serif" x="1080" y="156" font-size="15.5" font-weight="700" text-anchor="middle" fill="#F8F0F3">Govern and analyse</text>
<text class="sans" x="1080" y="218" font-size="13.5" text-anchor="middle" fill="#E5B5C7">Clean master data feeds</text><text class="sans" x="1080" y="238" font-size="13.5" text-anchor="middle" fill="#E5B5C7">reporting and BI</text></g><g class="motion"><circle r="6" fill="#F8F0F3" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="8.0s" begin="-0.00s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle><circle r="14" fill="#E5B5C7" opacity="0" filter="url(#ap-soft)"><set attributeName="opacity" to=".3" begin="0s"/><animateMotion dur="8.0s" begin="-0.00s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle><circle r="6" fill="#F8F0F3" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="8.0s" begin="-2.67s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle><circle r="14" fill="#E5B5C7" opacity="0" filter="url(#ap-soft)"><set attributeName="opacity" to=".3" begin="0s"/><animateMotion dur="8.0s" begin="-2.67s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle><circle r="6" fill="#F8F0F3" opacity="0"><set attributeName="opacity" to="1" begin="0s"/><animateMotion dur="8.0s" begin="-5.33s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle><circle r="14" fill="#E5B5C7" opacity="0" filter="url(#ap-soft)"><set attributeName="opacity" to=".3" begin="0s"/><animateMotion dur="8.0s" begin="-5.33s" repeatCount="indefinite"><mpath xlink:href="#ap-path"/></animateMotion></circle></g>
<text class="serif" x="40" y="58" font-size="22" font-style="italic" fill="#E5B5C7">How a data migration flows, end to end</text><rect x=".5" y=".5" width="1199" height="289" rx="20" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>