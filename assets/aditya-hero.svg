<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ash-title ash-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ash-title">Aditya Srivastav</title>
  <desc id="ash-desc">Solutions Consultant, Data and Analytics, AI and Enterprise Data Management. Burgundy animated banner with a fine grid, orbital geometry and a flowing data line.</desc>

  <defs>
    <style>
      .still { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .motion { display: none; }
        .still { display: inline; }
      }
      .name { font-family: Georgia, 'Times New Roman', 'Noto Serif', serif; font-weight: 700; letter-spacing: -1.5px; }
      .role { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 0.4px; }
    </style>

    <linearGradient id="ash-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#2A0D1B"/>
    </linearGradient>

    <radialGradient id="ash-glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ash-glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ash-name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8F0F3"/>
      <stop offset="1" stop-color="#E5B5C7"/>
    </linearGradient>
    <linearGradient id="ash-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#C77B9B"/>
      <stop offset="0.6" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ash-wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="0.7" stop-color="#E5B5C7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="ash-fade" cx="0.35" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="ash-gridmask"><rect width="1200" height="420" fill="url(#ash-fade)"/></mask>

    <pattern id="ash-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="ash-blur" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="ash-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <clipPath id="ash-clip"><rect width="1200" height="420" rx="20"/></clipPath>
    <path id="ash-path" d="M0 360 C120 360 160 318 260 328 S420 382 520 350 S700 298 800 322 S980 374 1100 334 S1180 318 1200 322"/>
  </defs>

  <g clip-path="url(#ash-clip)">
    <rect width="1200" height="420" fill="url(#ash-bg)"/>

    <!-- soft light: static base -->
    <ellipse cx="330" cy="130" rx="420" ry="210" fill="url(#ash-glow-a)"/>
    <ellipse cx="1010" cy="210" rx="260" ry="260" fill="url(#ash-glow-b)"/>
    <!-- soft light: drifting -->
    <g class="motion">
      <ellipse cx="330" cy="130" rx="300" ry="150" fill="url(#ash-glow-a)">
        <animate attributeName="cx" values="260;520;260" dur="22s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="22s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- fine technical grid -->
    <rect width="1200" height="420" fill="url(#ash-grid)" mask="url(#ash-gridmask)"/>

    <!-- orbital geometry -->
    <g transform="translate(1010 205)" fill="none" stroke="#E5B5C7">
      <circle r="62" stroke-opacity="0.22"/>
      <circle r="112" stroke-opacity="0.16" stroke-dasharray="2 7"/>
      <circle r="164" stroke-opacity="0.12"/>
      <ellipse rx="164" ry="62" transform="rotate(-24)" stroke="#C77B9B" stroke-opacity="0.35"/>
      <ellipse rx="112" ry="40" transform="rotate(38)" stroke="#C77B9B" stroke-opacity="0.22"/>
      <path d="M-190 0H190M0 -190V190" stroke-opacity="0.07"/>
      <circle r="5" fill="#E5B5C7" stroke="none"/>

      <g class="still" stroke="none">
        <circle cx="112" cy="0" r="4.5" fill="#F8F0F3"/>
        <circle cx="-116" cy="-116" r="3.5" fill="#C77B9B"/>
      </g>
      <g class="motion" stroke="none">
        <g>
          <circle cx="112" cy="0" r="4.5" fill="#F8F0F3"/>
          <circle cx="112" cy="0" r="10" fill="#E5B5C7" opacity="0.25" filter="url(#ash-soft)"/>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
        </g>
        <g>
          <circle cx="-116" cy="-116" r="3.5" fill="#C77B9B"/>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="64s" repeatCount="indefinite"/>
        </g>
      </g>
    </g>

    <!-- data line (static, complete) -->
    <use href="#ash-path" fill="none" stroke="url(#ash-wave)" stroke-width="2" stroke-linecap="round"/>
    <use href="#ash-path" fill="none" stroke="#701A3D" stroke-opacity="0.5" stroke-width="1" transform="translate(0 18)"/>
    <use href="#ash-path" fill="none" stroke="#701A3D" stroke-opacity="0.28" stroke-width="1" transform="translate(0 36)"/>

    <!-- data line (animated): drawn trace + travelling pulse -->
    <g class="motion">
      <path d="M0 360 C120 360 160 318 260 328 S420 382 520 350 S700 298 800 322 S980 374 1100 334 S1180 318 1200 322"
            fill="none" stroke="#F8F0F3" stroke-width="2.5" stroke-linecap="round" pathLength="1"
            stroke-dasharray="0.06 0.94" stroke-dashoffset="0" opacity="0.9" filter="url(#ash-soft)">
        <animate attributeName="stroke-dashoffset" from="0" to="-1" dur="9s" repeatCount="indefinite"/>
      </path>
      <circle r="4" fill="#F8F0F3">
        <animateMotion dur="9s" repeatCount="indefinite"><mpath href="#ash-path"/></animateMotion>
      </circle>
    </g>

    <!-- name -->
    <text class="name" x="76" y="206" font-size="78" fill="url(#ash-name)">Aditya Srivastav</text>

    <!-- glowing underline -->
    <g>
      <rect x="78" y="228" width="470" height="4" rx="2" fill="url(#ash-line)" filter="url(#ash-blur)" opacity="0.9"/>
      <rect x="78" y="228" width="470" height="2" rx="1" fill="url(#ash-line)"/>
      <g class="motion">
        <rect x="78" y="227" width="70" height="4" rx="2" fill="#F8F0F3" opacity="0.85" filter="url(#ash-soft)">
          <animate attributeName="x" values="78;478;78" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" keyTimes="0;0.5;1"/>
        </rect>
      </g>
    </g>

    <!-- role -->
    <text class="role" x="78" y="276" font-size="21" fill="#E5B5C7">Solutions Consultant  |  Data &amp; Analytics  |  AI &amp; Enterprise Data Management</text>
    <text class="role" x="78" y="308" font-size="15" fill="#C77B9B" fill-opacity="0.9">Prospecta Software</text>

    <!-- frame -->
    <rect x="0.5" y="0.5" width="1199" height="419" rx="20" fill="none" stroke="#C77B9B" stroke-opacity="0.22"/>
  </g>
</svg>
