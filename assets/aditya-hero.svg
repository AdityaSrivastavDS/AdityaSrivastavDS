<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Aditya Srivastav — Solutions Consultant</title>
  <desc id="hero-desc">A cinematic burgundy banner with a technical grid, animated data path, subtle orbital geometry, and a glowing underline.</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.55" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <linearGradient id="hero-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#701A3D" stop-opacity="0.08"/>
      <stop offset="0.48" stop-color="#C77B9B" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#701A3D" stop-opacity="0.04"/>
      <animate attributeName="x1" values="-80%;0%;-80%" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="20%;100%;20%" dur="22s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="hero-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#701A3D"/>
      <stop offset="0.52" stop-color="#E5B5C7"/>
      <stop offset="1" stop-color="#C77B9B"/>
      <animate attributeName="x1" values="0;0.25;0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="hero-halo">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#E5B5C7" stroke-opacity="0.11" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="1.2" fill="#E5B5C7" fill-opacity="0.26"/>
    </pattern>
    <filter id="hero-glow" x="-45%" y="-80%" width="190%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hero-soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="hero-clip"><rect x="0" y="0" width="1200" height="390" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="390" fill="url(#hero-bg)"/>
    <rect width="1200" height="390" fill="url(#hero-grid)" opacity="0.70"/>
    <rect x="0" y="0" width="1200" height="390" fill="url(#hero-sheen)"/>
    <ellipse cx="1000" cy="170" rx="330" ry="280" fill="url(#hero-halo)"/>
    <ellipse cx="1080" cy="185" rx="180" ry="140" fill="#701A3D" opacity="0.17" filter="url(#hero-soft)"/>

    <!-- restrained orbital geometry -->
    <g transform="translate(965 185)" fill="none" stroke="#E5B5C7" stroke-opacity="0.26">
      <ellipse rx="192" ry="72" transform="rotate(-28)" stroke-width="1.1"/>
      <ellipse rx="192" ry="72" transform="rotate(36)" stroke-width="1.1"/>
      <ellipse rx="142" ry="142" stroke-width="0.9" stroke-dasharray="3 10"/>
      <circle r="108" stroke-opacity="0.16"/>
      <circle cx="144" cy="-60" r="4" fill="#E5B5C7" stroke="none"/>
      <circle cx="-151" cy="44" r="3" fill="#C77B9B" stroke="none"/>
      <circle cx="37" cy="-137" r="3" fill="#F8F0F3" stroke="none"/>
      <circle r="8" fill="#C77B9B" fill-opacity="0.16" stroke="#C77B9B" stroke-opacity="0.75"/>
    </g>

    <!-- data path: a static curve remains visible when SMIL is unsupported -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M650 292 C724 252 760 275 814 225 S909 166 968 192 S1060 234 1152 122" stroke="#C77B9B" stroke-opacity="0.26" stroke-width="2" stroke-dasharray="7 12"/>
      <path d="M650 292 C724 252 760 275 814 225 S909 166 968 192 S1060 234 1152 122" stroke="url(#hero-accent)" stroke-width="2.3" stroke-dasharray="15 720" filter="url(#hero-glow)">
        <animate attributeName="stroke-dashoffset" values="735;0" dur="7s" repeatCount="indefinite"/>
      </path>
      <path d="M740 88 C805 112 850 94 920 70 S1058 42 1170 70" stroke="#E5B5C7" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="2 9"/>
      <path d="M795 326 C896 294 991 318 1150 270" stroke="#C77B9B" stroke-opacity="0.20" stroke-width="1.1"/>
    </g>
    <g fill="#F8F0F3">
      <circle cx="814" cy="225" r="3" opacity="0.8"/>
      <circle cx="968" cy="192" r="4" opacity="0.85"/>
      <circle cx="1152" cy="122" r="3.5" opacity="0.8"/>
    </g>

    <!-- editorial identity -->
    <path d="M78 72V318" stroke="#C77B9B" stroke-opacity="0.52" stroke-width="2"/>
    <path d="M78 72V132" stroke="#E5B5C7" stroke-width="3"/>
    <text x="112" y="112" fill="#E5B5C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="5">BUSINESS  /  DATA  /  TECHNOLOGY</text>
    <text x="106" y="207" fill="#F8F0F3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="67" font-weight="650" letter-spacing="-2.2">Aditya Srivastav</text>
    <text x="112" y="257" fill="#E5B5C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500" letter-spacing="1.1">SOLUTIONS CONSULTANT</text>
    <text x="112" y="294" fill="#C77B9B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="2.5">ENTERPRISE DATA  ·  ANALYTICS  ·  AI</text>
    <path d="M112 318H515" stroke="#C77B9B" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M112 318H515" stroke="url(#hero-accent)" stroke-width="3" stroke-linecap="round" filter="url(#hero-glow)" stroke-dasharray="120 403">
      <animate attributeName="stroke-dashoffset" values="-523;0;-523" dur="8s" repeatCount="indefinite"/>
    </path>
    <circle cx="520" cy="318" r="3" fill="#E5B5C7"/>
    <text x="112" y="354" fill="#F8F0F3" fill-opacity="0.48" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="3">BUILDING CLARITY FROM COMPLEXITY</text>
  </g>
  <rect x="1" y="1" width="1198" height="388" rx="21" fill="none" stroke="#C77B9B" stroke-opacity="0.30" stroke-width="1.3"/>
</svg>
