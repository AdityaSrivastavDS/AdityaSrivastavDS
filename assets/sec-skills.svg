<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 84" width="1200" height="84" role="img" aria-labelledby="ass-t ass-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ass-t">Toolkit</title><desc id="ass-d">what I build with</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="ass-clip"><rect width="1200" height="84" rx="14"/></clipPath>
<filter id="ass-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="ass-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="ass-bg" x1="0" x2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
<linearGradient id="ass-ln" x1="0" x2="1"><stop offset="0" stop-color="#C77B9B"/><stop offset=".7" stop-color="#701A3D" stop-opacity=".6"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></linearGradient>
<clipPath id="ass-tc"><rect x="0" y="0" width="1200" height="84"><animate attributeName="width" from="0" to="1200" dur="1.4s" fill="freeze"/></rect></clipPath></defs>
<g clip-path="url(#ass-clip)"><rect width="1200" height="84" fill="url(#ass-bg)"/>
<g class="motion"><rect y="68" x="34" width="1132" height="2" fill="url(#ass-ln)" opacity=".9"/><rect y="66" x="34" width="90" height="5" rx="2.5" fill="#F8F0F3" filter="url(#ass-soft)" opacity=".9"><animate attributeName="x" values="34;1076;34" dur="9s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/></rect>
<rect x="34" y="30" width="12" height="12" fill="#C77B9B" transform="rotate(45 40 36)"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></rect></g>
<g class="still"><rect y="68" x="34" width="1132" height="2" fill="url(#ass-ln)"/><rect x="34" y="30" width="12" height="12" fill="#C77B9B" transform="rotate(45 40 36)"/></g>
<g clip-path="url(#ass-tc)"><text class="serif" x="66" y="48" font-size="32" font-weight="700" fill="#F8F0F3">Toolkit</text></g>
<text class="sans" x="1166" y="46" font-size="15" text-anchor="end" fill="#C77B9B">what I build with</text><rect x=".5" y=".5" width="1199" height="83" rx="14" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>