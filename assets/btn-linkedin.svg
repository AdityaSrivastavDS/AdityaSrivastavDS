<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 142 46" width="142" height="46" role="img" aria-labelledby="ablinkedin-t ablinkedin-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="ablinkedin-t">LinkedIn</title><desc id="ablinkedin-d">Link button: LinkedIn</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="ablinkedin-clip"><rect width="142" height="46" rx="23"/></clipPath>
<filter id="ablinkedin-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="ablinkedin-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="ablinkedin-g" x1="0" x2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient><linearGradient id="ablinkedin-sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
<g clip-path="url(#ablinkedin-clip)"><rect width="142" height="46" fill="url(#ablinkedin-g)"/>
<rect x="1" y="1" width="140" height="44" rx="22" fill="none" stroke="#C77B9B" stroke-opacity=".4"/>
<rect class="motion" x="1" y="1" width="140" height="44" rx="22" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.22 0.78" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="3.6s" begin="-0s" repeatCount="indefinite"/></rect>
<g class="motion"><rect x="-60" y="0" width="60" height="46" fill="url(#ablinkedin-sh)" opacity=".5"><animate attributeName="x" values="-60;142" dur="4.5s" repeatCount="indefinite"/></rect></g>
<circle cx="24" cy="23" r="4" fill="#C77B9B"><animate attributeName="r" values="4;6;4" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.5;1" dur="1.8s" repeatCount="indefinite"/></circle>
<text class="sans" x="40" y="29" font-size="15" font-weight="700" fill="#F8F0F3">LinkedIn</text><rect x=".5" y=".5" width="141" height="45" rx="23" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>