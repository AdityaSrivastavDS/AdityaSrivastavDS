<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 110" width="1200" height="110" role="img" aria-labelledby="an-t an-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="an-t">Learning right now</title><desc id="an-d">Currently learning LangChain and Qdrant.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="an-clip"><rect width="1200" height="110" rx="16"/></clipPath>
<filter id="an-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="an-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="an-bg" x1="0" x2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient><clipPath id="an-tc"><rect x="60" y="30" width="760" height="50"><animate attributeName="width" values="0;760;760;0" keyTimes="0;.35;.9;1" dur="9s" repeatCount="indefinite"/></rect></clipPath></defs>
<g clip-path="url(#an-clip)"><rect width="1200" height="110" fill="url(#an-bg)"/>
<text class="mono" x="34" y="62" font-size="22" fill="#C77B9B">$</text>
<g clip-path="url(#an-tc)"><text class="mono" x="60" y="62" font-size="22" fill="#F8F0F3">learning --now LangChain Qdrant</text></g>
<rect x="469" y="40" width="12" height="26" fill="#E5B5C7"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<g class="still"><text class="mono" x="60" y="62" font-size="22" fill="#F8F0F3">learning --now LangChain Qdrant</text></g><rect x="880" y="34" width="130" height="40" rx="20" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".6"/><rect class="motion" x="880" y="34" width="130" height="40" rx="20" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.25 0.75" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="3s" begin="-0s" repeatCount="indefinite"/></rect><text class="sans" x="945" y="60" font-size="15" font-weight="700" text-anchor="middle" fill="#F8F0F3">LangChain</text><rect x="1030" y="34" width="130" height="40" rx="20" fill="#1d0d15" stroke="#C77B9B" stroke-opacity=".6"/><rect class="motion" x="1030" y="34" width="130" height="40" rx="20" fill="none" stroke="#E5B5C7" stroke-width="2" pathLength="1" stroke-dasharray="0.25 0.75" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-1" dur="4s" begin="-0s" repeatCount="indefinite"/></rect><text class="sans" x="1095" y="60" font-size="15" font-weight="700" text-anchor="middle" fill="#F8F0F3">Qdrant</text><rect x=".5" y=".5" width="1199" height="109" rx="16" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
