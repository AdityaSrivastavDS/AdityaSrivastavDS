<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 590 250" width="590" height="250" role="img" aria-labelledby="acp-t acp-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="acp-t">PoseGuard</title><desc id="acp-d">Real-time driver monitoring. A CNN flags unsafe postures, sounds an alert, saves a timestamped screenshot and logs it for review.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="acp-clip"><rect width="590" height="250" rx="18"/></clipPath>
<filter id="acp-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="acp-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="acp-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
<radialGradient id="acp-g"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#acp-clip)"><rect width="590" height="250" fill="url(#acp-bg)"/><ellipse cx="470" cy="125" rx="170" ry="130" fill="url(#acp-g)"/>
<rect x="28" y="30" width="10" height="10" fill="#C77B9B" transform="rotate(45 33 35)"/>
<text class="serif" x="48" y="48" font-size="27" font-weight="700" fill="#F8F0F3">PoseGuard</text><text class="sans" x="28" y="98" font-size="14" fill="#E5B5C7">Real-time driver monitoring. A CNN flags</text><text class="sans" x="28" y="120" font-size="14" fill="#E5B5C7">unsafe postures, sounds an alert, saves a</text><text class="sans" x="28" y="142" font-size="14" fill="#E5B5C7">timestamped screenshot and logs it for review.</text><rect x="28" y="196" width="66" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="39" y="213" font-size="12" fill="#E5B5C7">Python</text><rect x="102" y="196" width="96" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="113" y="213" font-size="12" fill="#E5B5C7">TensorFlow</text><rect x="206" y="196" width="66" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="217" y="213" font-size="12" fill="#E5B5C7">OpenCV</text><rect x="281" y="196" width="59" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="292" y="213" font-size="12" fill="#E5B5C7">Flask</text><path d="M392 70V52H410M540 52H558V70M392 182V200H410M540 200H558V182" fill="none" stroke="#C77B9B" stroke-width="2"/><g class="motion"><circle cx="475" cy="92" r="11" fill="none" stroke="#F8F0F3" stroke-width="2.5"><animate attributeName="cx" values="475;475;490;490;475" keyTimes="0;.3;.45;.8;1" dur="5s" repeatCount="indefinite"/></circle><path d="M475 103V152M475 114L447 138M475 114L503 134M475 152L458 192M475 152L494 192" fill="none" stroke="#F8F0F3" stroke-width="2.5" stroke-linecap="round"/><rect x="392" y="52" width="166" height="3" fill="#E5B5C7" opacity=".8" filter="url(#acp-soft)"><animate attributeName="y" values="52;196;52" dur="3.2s" repeatCount="indefinite"/></rect><circle cx="544" cy="66" r="5" fill="#E0457B"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.5;.8;1" dur="5s" repeatCount="indefinite"/></circle><text class="mono" x="500" y="70" font-size="11" fill="#E0457B" text-anchor="middle" opacity="0">unsafe<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.4;.5;.8;1" dur="5s" repeatCount="indefinite"/></text></g><g class="still"><circle cx="475" cy="92" r="11" fill="none" stroke="#F8F0F3" stroke-width="2.5"></circle><path d="M475 103V152M475 114L447 138M475 114L503 134M475 152L458 192M475 152L494 192" fill="none" stroke="#F8F0F3" stroke-width="2.5" stroke-linecap="round"/></g><rect x=".5" y=".5" width="589" height="249" rx="18" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>