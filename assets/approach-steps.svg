<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 490" width="1200" height="490" role="img" aria-labelledby="at-t at-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="at-t">How I approach enterprise data</title><desc id="at-d">Five principles: start with the requirement, surface the mess early, make the mapping explicit, validate with data owners, leave governance behind.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="at-clip"><rect width="1200" height="490" rx="20"/></clipPath>
<filter id="at-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="at-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="at-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10070C"/><stop offset="1" stop-color="#190B12"/></linearGradient>
<linearGradient id="at-ln" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5B5C7"/><stop offset="1" stop-color="#701A3D"/></linearGradient></defs>
<g clip-path="url(#at-clip)"><rect width="1200" height="490" fill="url(#at-bg)"/><rect x="69" y="64" width="3" height="344" rx="1.5" fill="url(#at-ln)"><animate attributeName="height" from="0" to="344" dur="2.4s" fill="freeze"/></rect><g class="motion"><circle cx="70.5" cy="64" r="6" fill="#F8F0F3" opacity="0" filter="url(#at-soft)"><set attributeName="opacity" to="1" begin="0s"/><animate attributeName="cy" values="64;408;64" dur="7s" repeatCount="indefinite"/></circle></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="0.40s" dur=".6s" fill="freeze"/>
<circle cx="70.5" cy="64" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="71" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">1</text>
<text class="serif" x="122" y="60" font-size="22" font-weight="700" fill="#F8F0F3">Start with the requirement, not the table.</text><text class="sans" x="122" y="86" font-size="16" fill="#E5B5C7">I pin down what the business needs the data to do before touching a field.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.85s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="0.85s" dur=".6s" fill="freeze"/>
<circle cx="70.5" cy="150" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="157" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">2</text>
<text class="serif" x="122" y="146" font-size="22" font-weight="700" fill="#F8F0F3">Surface the mess early.</text><text class="sans" x="122" y="172" font-size="16" fill="#E5B5C7">Profiling finds duplicates, gaps and conflicting definitions while they are still cheap to fix.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.30s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="1.30s" dur=".6s" fill="freeze"/>
<circle cx="70.5" cy="236" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="243" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">3</text>
<text class="serif" x="122" y="232" font-size="22" font-weight="700" fill="#F8F0F3">Make the mapping explicit.</text><text class="sans" x="122" y="258" font-size="16" fill="#E5B5C7">Every source field has a documented destination and a reason.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.75s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="1.75s" dur=".6s" fill="freeze"/>
<circle cx="70.5" cy="322" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="329" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">4</text>
<text class="serif" x="122" y="318" font-size="22" font-weight="700" fill="#F8F0F3">Validate with the people who own the data.</text><text class="sans" x="122" y="344" font-size="16" fill="#E5B5C7">Reconciliation counts only when the business signs off.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.20s" dur=".6s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="-24 0" to="0 0" begin="2.20s" dur=".6s" fill="freeze"/>
<circle cx="70.5" cy="408" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="415" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">5</text>
<text class="serif" x="122" y="404" font-size="22" font-weight="700" fill="#F8F0F3">Leave governance behind.</text><text class="sans" x="122" y="430" font-size="16" fill="#E5B5C7">Clean master data should stay clean, and feed the reporting that depends on it.</text></g><g class="still"><circle cx="70.5" cy="64" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="71" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">1</text><text class="serif" x="122" y="60" font-size="22" font-weight="700" fill="#F8F0F3">Start with the requirement, not the table.</text><text class="sans" x="122" y="86" font-size="16" fill="#E5B5C7">I pin down what the business needs the data to do before touching a field.</text><circle cx="70.5" cy="150" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="157" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">2</text><text class="serif" x="122" y="146" font-size="22" font-weight="700" fill="#F8F0F3">Surface the mess early.</text><text class="sans" x="122" y="172" font-size="16" fill="#E5B5C7">Profiling finds duplicates, gaps and conflicting definitions while they are still cheap to fix.</text><circle cx="70.5" cy="236" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="243" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">3</text><text class="serif" x="122" y="232" font-size="22" font-weight="700" fill="#F8F0F3">Make the mapping explicit.</text><text class="sans" x="122" y="258" font-size="16" fill="#E5B5C7">Every source field has a documented destination and a reason.</text><circle cx="70.5" cy="322" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="329" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">4</text><text class="serif" x="122" y="318" font-size="22" font-weight="700" fill="#F8F0F3">Validate with the people who own the data.</text><text class="sans" x="122" y="344" font-size="16" fill="#E5B5C7">Reconciliation counts only when the business signs off.</text><circle cx="70.5" cy="408" r="22" fill="#1d0d15" stroke="#C77B9B" stroke-width="2"/><text class="serif" x="70.5" y="415" font-size="21" font-weight="700" text-anchor="middle" fill="#F8F0F3">5</text><text class="serif" x="122" y="404" font-size="22" font-weight="700" fill="#F8F0F3">Leave governance behind.</text><text class="sans" x="122" y="430" font-size="16" fill="#E5B5C7">Clean master data should stay clean, and feed the reporting that depends on it.</text></g><rect x=".5" y=".5" width="1199" height="489" rx="20" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>