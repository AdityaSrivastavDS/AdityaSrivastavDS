<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 590 250" width="590" height="250" role="img" aria-labelledby="acd-t acd-d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="acd-t">AI-Augmented Design Feedback</title><desc id="acd-d">Predictive models that give feedback on the efficiency, safety and performance of mechanical designs, backed by simulations.</desc>
<defs><style>.still{display:none}@media (prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline}}
.serif{font-family:Georgia,'Times New Roman','Noto Serif',serif}.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}.mono{font-family:'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace}</style>
<clipPath id="acd-clip"><rect width="590" height="250" rx="18"/></clipPath>
<filter id="acd-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="acd-blur" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="6"/></filter>
<linearGradient id="acd-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/></linearGradient>
<radialGradient id="acd-g"><stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#701A3D" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#acd-clip)"><rect width="590" height="250" fill="url(#acd-bg)"/><ellipse cx="470" cy="125" rx="170" ry="130" fill="url(#acd-g)"/>
<rect x="28" y="30" width="10" height="10" fill="#C77B9B" transform="rotate(45 33 35)"/>
<text class="serif" x="48" y="48" font-size="21" font-weight="700" fill="#F8F0F3">AI-Augmented Design Feedback</text><text class="sans" x="28" y="98" font-size="14" fill="#E5B5C7">Predictive models that give feedback on the</text><text class="sans" x="28" y="120" font-size="14" fill="#E5B5C7">efficiency, safety and performance of</text><text class="sans" x="28" y="142" font-size="14" fill="#E5B5C7">mechanical designs, backed by simulations.</text><rect x="28" y="196" width="66" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="39" y="213" font-size="12" fill="#E5B5C7">Python</text><rect x="102" y="196" width="111" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="113" y="213" font-size="12" fill="#E5B5C7">scikit-learn</text><rect x="221" y="196" width="66" height="26" rx="13" fill="none" stroke="#C77B9B" stroke-opacity=".6"/><text class="mono" x="232" y="213" font-size="12" fill="#E5B5C7">pandas</text><g class="motion"><text class="sans" x="392" y="100" font-size="12" fill="#E5B5C7">Efficiency</text><rect x="392" y="108" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="108" width="120" height="10" rx="5" fill="#C77B9B"><animate attributeName="width" values="120;160;70;120" dur="4.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></rect><text class="sans" x="392" y="146" font-size="12" fill="#E5B5C7">Safety</text><rect x="392" y="154" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="154" width="90" height="10" rx="5" fill="#C77B9B"><animate attributeName="width" values="90;130;40;90" dur="5.1s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></rect><text class="sans" x="392" y="192" font-size="12" fill="#E5B5C7">Performance</text><rect x="392" y="200" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="200" width="140" height="10" rx="5" fill="#C77B9B"><animate attributeName="width" values="140;166;90;140" dur="3.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.33;.66;1" keySplines=".45 0 .55 1;.45 0 .55 1;.45 0 .55 1"/></rect></g><g class="still"><text class="sans" x="392" y="100" font-size="12" fill="#E5B5C7">Efficiency</text><rect x="392" y="108" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="108" width="120" height="10" rx="5" fill="#C77B9B"/><text class="sans" x="392" y="146" font-size="12" fill="#E5B5C7">Safety</text><rect x="392" y="154" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="154" width="90" height="10" rx="5" fill="#C77B9B"/><text class="sans" x="392" y="192" font-size="12" fill="#E5B5C7">Performance</text><rect x="392" y="200" width="166" height="10" rx="5" fill="#190B12" stroke="#C77B9B" stroke-opacity=".4"/><rect x="392" y="200" width="140" height="10" rx="5" fill="#C77B9B"/></g><rect x=".5" y=".5" width="589" height="249" rx="18" fill="none" stroke="#C77B9B" stroke-opacity=".22"/></g>
</svg>